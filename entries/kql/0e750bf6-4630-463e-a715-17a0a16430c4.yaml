id: 0e750bf6-4630-463e-a715-17a0a16430c4
name: Service Account Login on New Device
description: This detection rule identifies suspicious logins by service accounts on devices they haven't accessed in the last 14 days. This behavior could indicate a compromised service account being used for lateral movement within the environment. Service accounts typically have a static set of devices they authenticate to, making deviations easier to spot compared to user accounts. However, some service accounts (e.g., MDI service accounts) are known to dynamically log into devices, which may require environment-specific fine-tuning to reduce false positives.
query: |-
    let service_acc = (
        IdentityInfo
        | where TimeGenerated > ago(7d)
        | where Type == "ServiceAccount" and IsAccountEnabled == 1
        | distinct AccountName = tolower(AccountName)
    );
    let historic_events = (
        DeviceLogonEvents
        | where TimeGenerated between (ago(14d) .. ago(1h))
        | where ActionType == "LogonSuccess"
        | extend AccountName = tolower(AccountName)
        | join kind=inner service_acc on AccountName
        | summarize HistoricLogins = make_set(DeviceName) by AccountName
    );
    DeviceLogonEvents
    | where TimeGenerated > ago(1h)
    | where LogonType == "Network"
    | where ActionType == "LogonSuccess"
    | extend AccountName = tolower(AccountName)
    | join kind=inner service_acc on AccountName
    | join kind=inner historic_events on AccountName
    | extend HistoricLogins = tostring(HistoricLogins)
    | where HistoricLogins !contains DeviceName
    | project-away AccountName1, AccountName2
    | where AccountName != "gsma_mdi$"
query_type: kql
tactics:
    - TA0008
    - TA0005
    - TA0003
    - TA0004
    - TA0001
techniques:
    - T1021
    - T1078
tags:
    - kql
version: "1"
