id: 019c90bf-6d82-73cd-b971-1f46bcffecd6
name: DKnife Gateway AitM Hunt
description: This rule detects activity related to the DKnife gateway AitM (Adversary-in-the-Middle) threat, as detailed in Talos Intelligence reporting. It identifies specific binary names (dknife.bin, sslmm.bin, postapi.bin, rules.bin, sshapi.bin, inotify.bin, curlapi.bin) associated with the threat, either as process names or file names. Additionally, it looks for configuration artifacts (rules.conf, sslmm.cfg, url.cfg) used by the proxy/redirect logic, either as file names or within process command lines. Finally, the rule identifies exfiltration or tagging markers (dkimsi=, 460110672021628, PASSWORD) observed in logs or artifacts, which are indicative of DKnife's reporting mechanisms.
query: |-
    let dknife_binaries = dynamic(["dknife.bin", "sslmm.bin", "postapi.bin", "rules.bin", "sshapi.bin", "inotify.bin", "curlapi.bin"]);
    let dknife_configs = dynamic(["rules.conf", "sslmm.cfg", "url.cfg"]);
    let dknife_markers = dynamic(["dkimsi=", "460110672021628", "PASSWORD"]);
    union isfuzzy=true
    (
        DeviceProcessEvents
        | where FileName in~ (dknife_binaries)
            or ProcessCommandLine has_any (dknife_configs)
            or ProcessCommandLine has_any (dknife_markers)
        | project Timestamp, DeviceName, EvidenceType = "process", FileName, FolderPath, ProcessCommandLine, AccountName
    ),
    (
        DeviceFileEvents
        | where FileName in~ (dknife_binaries)
            or FileName in~ (dknife_configs)
            or FolderPath has_any (dknife_configs)
        | project Timestamp, DeviceName, EvidenceType = "file", FileName, FolderPath, SHA256, InitiatingProcessCommandLine
    ),
    (
        DeviceEvents
        | where tostring(AdditionalFields) has_any (dknife_markers)
            or InitiatingProcessCommandLine has_any (dknife_markers)
        | project Timestamp, DeviceName, EvidenceType = "marker", ActionType, AdditionalFields, InitiatingProcessCommandLine
    )
query_type: kql
severity: medium
tactics:
    - TA0010
    - TA0006
    - TA0009
    - TA0011
techniques:
    - T1557
    - T1071.001
tags:
    - kql
author: Daniel Jeremaih
version: "3"
references:
    - https://blog.talosintelligence.com/knife-cutting-the-edge/
