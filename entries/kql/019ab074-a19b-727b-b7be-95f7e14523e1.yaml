id: 019ab074-a19b-727b-b7be-95f7e14523e1
name: NotDoor behavior pattern
description: |
    This query identifies an anomalous pattern associated with behavior performed by NotDoor to establish persistence and avoid its detection.
query: |-
    let starttime = ago(90d);
    let endtime = now();
    let abnormalActions = 4.0;
    let notdoor_file_events = materialize(
        DeviceFileEvents
        | where TimeGenerated between (starttime .. endtime)
        | where ActionType in ("FileCreated", "FileModified")
        | where FolderPath has @"\appdata\roaming" and FileName =~ "vbaproject.otm"
    );
    let notdoor_registry_events = materialize(
        DeviceRegistryEvents
        | where TimeGenerated between (starttime .. endtime)
        | where ActionType == "RegistryValueSet"
        | where (RegistryKey endswith @"\software\microsoft\office\16.0\outlook" and RegistryValueName =~ "loadmacroprovideronboot" and RegistryValueData == "1")
            or (RegistryKey endswith @"\software\microsoft\office\16.0\outlook\security" and RegistryValueName =~ "level" and RegistryValueData == "1")
            or (RegistryKey endswith @"\software\microsoft\office\16.0\outlook\options\general" and RegistryValueName =~ "pont_string" and RegistryValueData == "32")
    );
    let confidence = materialize(
        union notdoor_file_events, notdoor_registry_events
        | summarize fileActions = make_set(FileName), registryActions = make_set(RegistryValueName) by bin(TimeGenerated, 1h), DeviceName
        | extend confidenceScore = case(
            isempty(registryActions[0]), round(array_length(fileActions) / abnormalActions, 2),
            isempty(fileActions[0]), round(array_length(registryActions) / abnormalActions, 2),
            round((array_length(fileActions) + array_length(registryActions)) / abnormalActions, 2)
        )
    );
    union notdoor_file_events, notdoor_registry_events
    | join kind=leftouter (confidence) on DeviceName
    | where confidenceScore >= 0.75
    | project-away *1
    | project-reorder TimeGenerated, Type, ActionType, confidenceScore
    | sort by TimeGenerated asc
query_type: kql
severity: medium
tactics:
    - TA0003
    - TA0005
techniques:
    - T1137
    - T1112
tags:
    - kql
    - tactic:Persistence
    - tactic:Defense Evasion
    - technique:T1137
    - technique:T1112
version: "7"
references:
    - https://www.splunk.com/en_us/blog/security/notdoor-insights-a-closer-look-at-outlook-macros-and-more.html
data_sources:
    - DeviceFileEvents
    - DeviceRegistryEvents
