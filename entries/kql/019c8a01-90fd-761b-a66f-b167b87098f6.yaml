id: 019c8a01-90fd-761b-a66f-b167b87098f6
name: Ivanti EPMM RCE Exploit Attempt (CVE-2026-1281, CVE-2026-1340)
description: This rule detects potential exploitation attempts against Ivanti Endpoint Manager Mobile (EPMM) vulnerabilities CVE-2026-1281 and CVE-2026-1340. The detection looks for HTTP requests to vulnerable URI paths that contain the 'gPath' parameter, which is a key indicator of the bash arithmetic expansion exploit.
query: |-
    let vulnerable_paths = dynamic(["/mifs/c/appstore/fob", "/mifs/c/aftstore/fob"]);
    union isfuzzy=true CommonSecurityLog, W3CIISLog, DeviceNetworkEvents
    | where (isnotempty(RequestURL) and RequestURL has_any (vulnerable_paths) and RequestURL contains "gPath")
        or (isnotempty(csUriStem) and csUriStem has_any (vulnerable_paths) and csUriQuery contains "gPath")
        or (isnotempty(RemoteUrl) and RemoteUrl has_any (vulnerable_paths) and RemoteUrl contains "gPath")
    | extend Timestamp = coalesce(TimeGenerated, EventTime),
        SrcIp = coalesce(SourceIP, c_ip, RemoteIP),
        DestIp = coalesce(DestinationIP, s_ip, LocalIP),
        Url = coalesce(RequestURL, strcat(csUriStem, "?", csUriQuery), RemoteUrl),
        AttemptedCommand = extract(@"gPath\['([^'\]]+)", 1, Url)
    | project-reorder Timestamp, SrcIp, DestIp, Url, AttemptedCommand
    | extend AccountCustomEntity = SrcIp,
        IPCustomEntity = SrcIp,
        HostCustomEntity = DestIp,
        URLCustomEntity = Url
query_type: kql
severity: medium
tactics:
    - TA0001
    - TA0002
techniques:
    - T1190
    - T1059.004
tags:
    - kql
version: "2"
references:
    - https://unit42.paloaltonetworks.com/ivanti-cve-2026-1281-cve-2026-1340/
