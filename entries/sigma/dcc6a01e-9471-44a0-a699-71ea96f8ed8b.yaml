name: Exploitation Attempt Of CVE-2020-1472 - Execution of ZeroLogon PoC
description: Detects the execution of the commonly used ZeroLogon PoC executable.
query: |
    title: Exploitation Attempt Of CVE-2020-1472 - Execution of ZeroLogon PoC
    id: dcc6a01e-9471-44a0-a699-71ea96f8ed8b
    status: test
    description: Detects the execution of the commonly used ZeroLogon PoC executable.
    references:
        - https://thedfirreport.com/2021/11/01/from-zero-to-domain-admin/
        - https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
    author: '@Kostastsale, TheDFIRReport'
    date: 2022-02-12
    tags:
        - attack.execution
        - attack.lateral-movement
        - attack.t1210
        - cve.2020-1472
        - detection.emerging-threats
    logsource:
        product: windows
        category: process_creation
    detection:
        selection_main:
            ParentImage|endswith: '\cmd.exe'
            Image|endswith:
                - '\cool.exe'
                - '\zero.exe'
            CommandLine|contains|all:
                - 'Administrator'
                - '-c'
        selection_payloads_1:
            CommandLine|contains|all:
                - 'taskkill'
                - '/f'
                - '/im'
        selection_payloads_2:
            CommandLine|contains: 'powershell'
        condition: selection_main and 1 of selection_payloads_*
    falsepositives:
        - Unknown
    level: high
