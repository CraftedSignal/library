id: b4de1709-c232-5e6f-7081-920314253647
name: M365 Copilot - Cross-Site Aggregation in Short Window
description: |
    Detects Copilot sessions touching 5+ distinct SharePoint/OneDrive
    sites within a 15-minute window by the same user. Pattern of bulk
    information aggregation — what Microsoft Purview calls the "Copilot
    as privilege multiplier" risk.
query: |
    title: M365 Copilot - Cross-Site Aggregation in Short Window
    id: b4de1709-c232-5e6f-7081-920314253647
    status: experimental
    description: |
      Detects Copilot sessions touching 5+ distinct SharePoint/OneDrive
      sites within a 15-minute window by the same user. Pattern of bulk
      information aggregation — what Microsoft Purview calls the "Copilot
      as privilege multiplier" risk.
    references:
      - https://atlas.mitre.org/techniques/AML.T0086
      - https://atlas.mitre.org/techniques/AML.T0024
    author: Raymond DePalma (ai-dfir-toolkit)
    date: 2026-04-15
    tags:
      - attack.collection
      - attack.atlas.t0024
      - attack.atlas.t0086
      - owasp.llm02
    logsource:
      product: m365
      service: audit
    detection:
      selection_operation:
        Operation:
          - 'CopilotInteraction'
          - 'AIAppInteraction'
      selection_has_url:
        AccessedResources|contains: '/sites/'
      condition: all of selection_*
      timeframe: 15m
    fields:
      - UserId
      - ClientIP
      - AccessedResources
    falsepositives:
      - Legitimate cross-site research tasks (M&A due diligence, audit prep)
      - Executive assistants genuinely summarizing content across sites
    level: medium
query_type: sigma
severity: medium
