    logsource:
        category: webserver
    detection:
        base_url:
            cs-method: 'GET'
            cs-uri-query|contains|all:
                - '/include/makecvs.php'
                - '?Event='
        payload:
            cs-uri-query|contains:
                - 'curl'
                - 'wget'
                - '.py'
                - '.sh'
                - 'chmod'
                - '_GET'
        condition: base_url and payload
    falsepositives:
        - Unknown
    level: high
