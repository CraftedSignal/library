    date: 2023-01-04
    tags:
        - attack.collection
        - attack.credential-access
        - attack.t1056.001
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains: '[Windows.Input.Keyboard]::IsKeyDown([System.Windows.Input.Key]::'
        condition: selection
    falsepositives:
        - Unknown
    level: medium
