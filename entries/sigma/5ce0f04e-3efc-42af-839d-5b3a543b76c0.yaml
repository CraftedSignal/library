    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            Image|contains:
                # e.g. C:\$RECYCLER.BIN
                - 'RECYCLERS.BIN\'
                - 'RECYCLER.BIN\'
        condition: selection
    falsepositives:
        - Unlikely
    level: high
