    author: Daniil Yugoslavskiy, oscd.community
    date: 2020-10-19
    modified: 2026-11-03
    tags:
        - attack.discovery
        - attack.t1049
    logsource:
        category: process_creation
        product: linux
    detection:
        selection:
            Image|endswith:
                - '/lsof'
                - '/netstat'
                - '/sockstat'
                - '/ss'
        condition: selection
    falsepositives:
        - Legitimate administration activities
    level: low
