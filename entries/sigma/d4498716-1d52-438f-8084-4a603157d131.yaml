id: d4498716-1d52-438f-8084-4a603157d131
name: Password Provided In Command Line Of Net.EXE
description: Detects a when net.exe is called with a password in the command line
query: |
    title: Password Provided In Command Line Of Net.EXE
    id: d4498716-1d52-438f-8084-4a603157d131
    status: test
    description: Detects a when net.exe is called with a password in the command line
    references:
        - Internal Research
    author: Tim Shelton (HAWK.IO)
    date: 2021-12-09
    modified: 2023-02-21
    tags:
        - attack.initial-access
        - attack.persistence
        - attack.privilege-escalation
        - attack.lateral-movement
        - attack.stealth
        - attack.t1021.002
        - attack.t1078
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith:
                  - '\net.exe'
                  - '\net1.exe'
            - OriginalFileName:
                  - 'net.exe'
                  - 'net1.exe'
        selection_cli:
            CommandLine|contains|all:
                - ' use '
                - ':*\\'
                - '/USER:* *'
        filter_main_empty:
            CommandLine|endswith: ' '
        condition: all of selection_* and not 1 of filter_main_*
    falsepositives:
        - Unknown
    level: medium
