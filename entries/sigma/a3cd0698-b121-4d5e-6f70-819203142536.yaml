id: a3cd0698-b121-4d5e-6f70-819203142536
name: M365 Copilot - User Activity (first-time-burst baseline pre-filter)
description: |
    Selects Copilot/AI-app interaction events so a backend can baseline
    per-user volume and flag previously-inactive users who suddenly generate
    high-volume activity (account takeover or new insider-threat patterns).

    NOT a standalone alert: on its own this matches every Copilot interaction.
    Pure Sigma cannot compare against a 30-day per-user baseline, so pair it
    with a backend aggregation/enrich step (e.g. count by UserId over 24h vs a
    30-day baseline). Deploy as a correlation feed, not a direct detection.
