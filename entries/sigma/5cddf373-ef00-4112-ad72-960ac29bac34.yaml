    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith: '\cmd.exe'
            - OriginalFileName: 'Cmd.Exe'
        selection_cli:
            CommandLine|contains|all:
                - '/q'
                - '/c'
                - 'chcp'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: high
