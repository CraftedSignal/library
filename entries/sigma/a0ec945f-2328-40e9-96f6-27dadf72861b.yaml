name: Javaw Spawning Suspicious Powershell Commands
description: Detects Javaw spawning suspicious powershell commands. This has been observed as possible post-exploitation activity of Cleo software.
query: "title: Javaw Spawning Suspicious Powershell Commands\nid: a0ec945f-2328-40e9-96f6-27dadf72861b\nstatus: experimental\ndescription: Detects Javaw spawning suspicious powershell commands. This has been observed as possible post-exploitation activity of Cleo software.\nauthor: Chad Hudson, Matt Anderson\nreferences: \n    - https://www.huntress.com/blog/threat-advisory-oh-no-cleo-cleo-software-actively-being-exploited-in-the-wild\ndate: 2024/12/09\nlogsource:\n    category: process_creation\n    product: windows\ndetection:\n    selection:\n        ParentImage|endswith:\n            - '\\javaw.exe'\n        Image|endswith:\n            - '\\cmd.exe'\n    cmdline:\n        CommandLine|contains:\n            - ' -nop'\n            - ' -noni'\n            - ' -NonInteractive'\n            - ' -w hidden '\n            - ' -windowstyle hidden*'\n            - '(New-Object Net.WebClient).Download*'\n            - ' -enc '\n            - ' -EncodedCommand '\n    powershell:\n        CommandLine|contains: powershell\n    condition: selection and cmdline and powershell\nfalsepositives:\n    - Unknown\n"
