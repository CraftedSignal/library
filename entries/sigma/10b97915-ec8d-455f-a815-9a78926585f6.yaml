    detection:
        selection:
            objectRef.apiGroup: 'rbac.authorization.k8s.io'
            objectRef.resource:
                - 'clusterrolebindings'
                - 'rolebindings'
            verb:
                - 'create'
                - 'delete'
                - 'patch'
                - 'replace'
                - 'update'
        condition: selection
    falsepositives:
