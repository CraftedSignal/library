    modified: 2023-05-09
    tags:
        - attack.defense-impairment
        - attack.t1685
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains:
                - "if(0){{{0}}}' -f $(0 -as [char]) +"
                - "#<NULL>"
        condition: selection
    falsepositives:
        - Unknown
    level: medium
