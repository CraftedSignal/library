        - attack.execution
        - attack.t1059.001
    logsource:
        product: windows
        service: security
        definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
    detection:
        selection:
            EventID: 4697
            ServiceFileName|contains|all:
                - 'mshta'
                - 'vbscript:createobject'
                - '.run'
                - 'window.close'
        condition: selection
    falsepositives:
        - Unknown
    level: high
