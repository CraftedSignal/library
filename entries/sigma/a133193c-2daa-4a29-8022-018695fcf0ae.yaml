        - attack.t1190
        - attack.t1505.003
        - cve.2014-6287
        - detection.emerging-threats
    logsource:
        category: webserver
    detection:
        selection_search:
            cs-uri-query|contains: '?search=%00{.'
        selection_payload:
            cs-uri-query|contains:
                - 'save|' # Indication of saving a file which shouldn't be tested by vuln scanners
                - 'powershell'
                - 'cmd.exe'
                - 'cmd /c'
                - 'cmd /r'
                - 'cmd /k'
                - 'cscript'
                - 'wscript'
                - 'python'
                - 'C:\Users\Public\'
                - '%comspec%'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: high
