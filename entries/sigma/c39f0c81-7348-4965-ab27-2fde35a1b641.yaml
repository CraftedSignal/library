    logsource:
        product: windows
        service: security
    detection:
        selection:
            EventID: 5145
            RelativeTargetName|endswith: '\Internet Explorer\iertutil.dll'
        filter:
            SubjectUserName|endswith: '$'
        condition: selection and not filter
    falsepositives:
        - Unknown
    level: high
