    tags:
        - attack.privilege-escalation
        - attack.execution
        - attack.t1047
        - attack.persistence
        - attack.t1546.003
    logsource:
        product: windows
        category: wmi_event
    detection:
        selection_destination:
            Destination|base64offset|contains:
                - 'WriteProcessMemory'
                - 'This program cannot be run in DOS mode'
                - 'This program must be run under Win32'
        condition: selection_destination
    falsepositives:
        - Unknown
    level: high
