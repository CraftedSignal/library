name: Potential CCleanerDU.DLL Sideloading
description: Detects potential DLL sideloading of "CCleanerDU.dll"
query: |
    title: Potential CCleanerDU.DLL Sideloading
    id: 1fbc0671-5596-4e17-8682-f020a0b995dc
    status: test
    description: Detects potential DLL sideloading of "CCleanerDU.dll"
    references:
        - https://lab52.io/blog/2344-2/
    author: X__Junior (Nextron Systems)
    date: 2023-07-13
    tags:
        - attack.persistence
        - attack.privilege-escalation
        - attack.execution
        - attack.stealth
        - attack.t1574.001
    logsource:
        category: image_load
        product: windows
    detection:
        selection:
            ImageLoaded|endswith: '\CCleanerDU.dll'
        filter_main_path:
            Image|startswith:
                - 'C:\Program Files\CCleaner\'
                - 'C:\Program Files (x86)\CCleaner\'
            Image|endswith:
                - '\CCleaner.exe'
                - '\CCleaner64.exe'
        condition: selection and not 1 of filter_main_*
    falsepositives:
        - False positives could occur from other custom installation paths. Apply additional filters accordingly.
    level: medium
