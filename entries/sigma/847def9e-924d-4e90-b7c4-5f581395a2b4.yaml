    author: Florian Roth (Nextron Systems)
    date: 2018-02-10
    modified: 2024-06-27
    tags:
        - attack.credential-access
        - attack.t1003.002
    logsource:
        category: file_event
        product: windows
    detection:
        selection:
            TargetFilename|contains|all:
                - '\AppData\Local\Temp\SAM-'
                - '.dmp'
        condition: selection
    falsepositives:
        - Unknown
    level: critical
