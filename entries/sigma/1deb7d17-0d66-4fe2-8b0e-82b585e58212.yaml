name: Suspicious Shell Process from Next.js
description: Detects execution of a suspicious shell process from a parent Next (Next.js) Process. This is a possible indication of exploitation of Meta React Server Components vulnerability identified as CVE-2025-55182, "React2Shell".
query: "title: Suspicious Shell Process from Next.js\nid: 1deb7d17-0d66-4fe2-8b0e-82b585e58212\nstatus: experimental\ndescription: Detects execution of a suspicious shell process from a parent Next (Next.js) Process. \n             This is a possible indication of exploitation of Meta React Server Components vulnerability identified as CVE-2025-55182, \"React2Shell\". \nreferences:\n - https://www.cisa.gov/news-events/alerts/2025/12/05/cisa-adds-one-known-exploited-vulnerability-catalog\n - https://www.wiz.io/blog/critical-vulnerability-in-react-cve-2025-55182\n - https://aws.amazon.com/blogs/security/china-nexus-cyber-threat-groups-rapidly-exploit-react2shell-vulnerability-cve-2025-55182/\n - https://nvd.nist.gov/vuln/detail/CVE-2025-55182\nauthor: Craig Sweeney, Anna Pham, Michael Tigges, Matt Anderson, Andrew Schwartz (Huntress)\ndate: 2025-12-08\ntags:\n  - attack.initial_access\n  - attack.execution\n  - attack.t1059.004\n  - attack.t1190\n  - attack.ta0001\n  - attack.ta0002\nlogsource:\n    category: process_creation\n    product: linux\ndetection:\n    parent_selection:\n      ParentImage|endswith: '/next'\n    selection:\n      Image|endswith:\n        - '/zsh'\n        - '/sh'\n        - '/bash'\n    condition: parent_selection and selection\nfalsepositives:\n    - unknown\nlevel: medium"
