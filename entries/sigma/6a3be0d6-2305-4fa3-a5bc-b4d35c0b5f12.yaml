id: 6a3be0d6-2305-4fa3-a5bc-b4d35c0b5f12
name: Shell Process from Gladinet CentreStack or Triofox
description: Detects execution of a shell process from the "Portal" Application Pool used by Gladinet Centrestack or the “Management” Application Pool used by Triofox, as a parent process. This may indicate successful exploitation of a vulnerability in Centrestack or Triofox.
query: "title: Shell Process from Gladinet CentreStack or Triofox\nid: 6a3be0d6-2305-4fa3-a5bc-b4d35c0b5f12\nstatus: experimental\ndescription: Detects execution of a shell process from the \"Portal\" Application Pool used by Gladinet Centrestack or the “Management” Application Pool used by Triofox, as a parent process. This may indicate successful exploitation of a vulnerability in Centrestack or Triofox.\nauthor: Craig Sweeney, Jai Minton, Michael Tigges, Matt Anderson, John Hammond (Huntress)\nreferences:\n - https://www.cisa.gov/news-events/alerts/2025/04/08/cisa-adds-two-known-exploited-vulnerabilities-catalog\n - https://gladinetsupport.s3.us-east-1.amazonaws.com/gladinet/securityadvisory-cve-2005.pdf\n - https://gladinetsupport.s3.us-east-1.amazonaws.com/gladinet/securityadvisory-cve-2025-triofox.pdf\n - https://nvd.nist.gov/vuln/detail/CVE-2025-30406\ndate: 2025-04-12\nmodified: 2025-04-14\nlogsource:\n  category: process_creation\n  product: windows\ndetection:\n shell_process:\n  Image|endswith:\n    - '\\cmd.exe'\n    - '\\powershell.exe'\n    - '\\powershell_ise.exe'\n selection_parent:\n  ParentImage|endswith: '\\w3wp.exe'\n  ParentCommandLine|contains: \n    - '\\portal\\portal.config'\n    - '\\management\\management.config'\n condition: shell_process and selection_parent\nfalsepositives:\n - Unknown\nlevel: medium\ntags:\n  - attack.initial_access\n  - attack.execution\n  - attack.t1059.001\n  - attack.t1059.003\n  - attack.t1190\n  - attack.ta0001\n  - attack.ta0002"
