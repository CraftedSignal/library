id: 7f1e6b2a-0c94-4b7e-9d3a-2f6c1a0e5b41
name: Script Interpreter Resolving LLM Provider API Endpoint
description: |
    Detects a script host / LOLBin resolving a large-language-model provider API endpoint at runtime.
    Runtime LLM-malware ("just-in-time code creation", e.g. PROMPTFLUX, PROMPTSTEAL/LAMEHUG, FRUITSHELL,
    PROMPTLOCK) calls an LLM API during execution to generate obfuscated code or OS commands. A DNS query
    to generativelanguage.googleapis.com / api-inference.huggingface.co / api.anthropic.com / api.openai.com
    from wscript, cscript, mshta, rundll32, regsvr32 (and, with tuning, powershell/python/node) is anomalous
    on most endpoints and is the earliest network-visible signal of this class.
query: |
    title: Script Interpreter Resolving LLM Provider API Endpoint
    name: script_interpreter_llm_api_dns
    id: 7f1e6b2a-0c94-4b7e-9d3a-2f6c1a0e5b41
    status: experimental
    description: |
        Detects a script host / LOLBin resolving a large-language-model provider API endpoint at runtime.
        Runtime LLM-malware ("just-in-time code creation", e.g. PROMPTFLUX, PROMPTSTEAL/LAMEHUG, FRUITSHELL,
        PROMPTLOCK) calls an LLM API during execution to generate obfuscated code or OS commands. A DNS query
        to generativelanguage.googleapis.com / api-inference.huggingface.co / api.anthropic.com / api.openai.com
        from wscript, cscript, mshta, rundll32, regsvr32 (and, with tuning, powershell/python/node) is anomalous
        on most endpoints and is the earliest network-visible signal of this class.
    references:
        - https://cloud.google.com/blog/topics/threat-intelligence/threat-actor-usage-of-ai-tools
        - https://thehackernews.com/2025/11/google-uncovers-promptflux-malware-that.html
        - https://atlas.mitre.org/techniques/AML.T0096
    author: Raymond DePalma (@depalmar)
    date: 2026-08-12
    tags:
        - attack.command-and-control
        - attack.t1071.001
        - atlas.aml-t0096
        - atlas.aml-t0086
    logsource:
        category: dns_query
        product: windows
    detection:
        selection_proc:
            Image|endswith:
                # High-fidelity: these hosts have little legitimate reason to call an LLM API
                - '\wscript.exe'
                - '\cscript.exe'
                - '\mshta.exe'
                - '\rundll32.exe'
                - '\regsvr32.exe'
                - '\hh.exe'
                # Broader interpreters (tune/allowlist for dev environments - see falsepositives)
                - '\powershell.exe'
                - '\pwsh.exe'
                - '\python.exe'
                - '\pythonw.exe'
                - '\node.exe'
                - '\curl.exe'
        selection_llm:
            QueryName|contains:
                - 'generativelanguage.googleapis.com'
                - 'api-inference.huggingface.co'
                - 'api.anthropic.com'
                - 'api.openai.com'
                - 'api.deepseek.com'
                - 'openrouter.ai'
                - 'openai.azure.com'
                - 'api.x.ai'
                - 'aiplatform.googleapis.com'
                - 'bedrock-runtime'
        condition: selection_proc and selection_llm
    falsepositives:
        - Developer / automation / CI scripts that legitimately call LLM APIs (Python, Node, PowerShell). Allowlist by user, host, or signed script.
        - Sanctioned internal AI tooling wrapped in script hosts.
    level: medium
query_type: sigma
severity: medium
techniques:
    - T1071.001
