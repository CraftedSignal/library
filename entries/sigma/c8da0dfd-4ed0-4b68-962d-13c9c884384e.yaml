        category: process_creation
        product: windows
    detection:
        selection:
            ParentImage|endswith: '\Windows\System32\lsass.exe'
            Image|endswith: '\Windows\System32\lsass.exe'
        condition: selection
    falsepositives:
        - Unknown
    level: critical
