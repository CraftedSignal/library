        - attack.t1490
        - detection.emerging-threats
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith:
                  - '\tasksche.exe'
                  - '\mssecsvc.exe'
                  - '\taskdl.exe'
                  - '\taskhsvc.exe'
                  - '\taskse.exe'
                  - '\111.exe'
                  - '\lhdfrgui.exe'
                  # - '\diskpart.exe'  # cannot be used in a rule of level critical
                  - '\linuxnew.exe'
                  - '\wannacry.exe'
            - Image|contains: 'WanaDecryptor'
        selection_cmd:
            CommandLine|contains: '@Please_Read_Me@.txt'
        condition: 1 of selection_*
    falsepositives:
        - Unknown
    level: critical
