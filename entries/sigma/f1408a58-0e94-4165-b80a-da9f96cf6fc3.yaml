    author: Sohan G (D4rkCiph3r)
    date: 2023-01-31
    tags:
        - attack.t1059.002
        - attack.t1059.007
        - attack.execution
    logsource:
        product: macos
        category: process_creation
    detection:
        selection_main:
            CommandLine|contains|all:
                - 'osascript'
                - ' -e '
                - 'eval'
                - 'NSData.dataWithContentsOfURL'
        selection_js:
            - CommandLine|contains|all:
                  - ' -l '
                  - 'JavaScript'
            - CommandLine|contains: '.js'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: high
