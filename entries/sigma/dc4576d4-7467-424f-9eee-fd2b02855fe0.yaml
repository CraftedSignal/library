    tags:
        - attack.stealth
        - attack.t1202
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith: '\msdt.exe'
            - OriginalFileName: 'msdt.exe'
        selection_cmd:
            CommandLine|contains|windash: ' -cab '
        condition: all of selection_*
    falsepositives:
        - Legitimate usage of ".diagcab" files
    level: medium
