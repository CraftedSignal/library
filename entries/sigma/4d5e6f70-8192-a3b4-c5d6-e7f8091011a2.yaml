id: 4d5e6f70-8192-a3b4-c5d6-e7f8091011a2
name: HuggingFace Token Exposure / Leak
description: |
    Detects exposure of HuggingFace API tokens (hf_*) in logs, command
    lines, network requests, or files. Lasso Security found ~1,700
    exposed HF tokens in 2024 granting access to 600+ accounts including
    Google, Meta, and Microsoft. Token exposure is a precursor to model
    registry compromise and namespace hijacking.
query: |
    title: HuggingFace Token Exposure / Leak
    id: 4d5e6f70-8192-a3b4-c5d6-e7f8091011a2
    status: experimental
    description: |
      Detects exposure of HuggingFace API tokens (hf_*) in logs, command
      lines, network requests, or files. Lasso Security found ~1,700
      exposed HF tokens in 2024 granting access to 600+ accounts including
      Google, Meta, and Microsoft. Token exposure is a precursor to model
      registry compromise and namespace hijacking.
    references:
      - https://www.lasso.security/blog/huggingface-vulnerable-to-account-takeover
      - https://huggingface.co/docs/hub/security-tokens
      - https://atlas.mitre.org/techniques/AML.T0086
    author: Raymond DePalma (ai-dfir-toolkit)
    date: 2026-04-15
    tags:
      - attack.credential_access
      - attack.t1552.001
      - attack.atlas.t0086
    logsource:
      category: process_creation
    detection:
      selection_token_in_cmdline:
        CommandLine|re: 'hf_[a-zA-Z0-9]{34,40}'
      selection_token_export:
        CommandLine|contains:
          - 'HUGGING_FACE_HUB_TOKEN='
          - 'HF_TOKEN='
          - 'HUGGINGFACEHUB_API_TOKEN='
          - 'HF_API_TOKEN='
      filter_documentation:
        CommandLine|contains:
          - 'hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
          - 'hf_YOUR_TOKEN_HERE'
          - 'hf_REPLACE_ME'
      condition: 1 of selection_* and not filter_documentation
    fields:
      - User
      - Image
      - CommandLine
      - ParentCommandLine
    falsepositives:
      - CI/CD systems passing tokens via command line (should use env vars / secret managers instead)
      - Documentation or training material with placeholder tokens
    level: high
query_type: sigma
severity: high
techniques:
    - T1552.001
