    logsource:
        category: registry_set
        product: windows
    detection:
        selection:
            TargetObject:
                - 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LocalAccountTokenFilterPolicy'
                - 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLinkedConnections'
                - 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem\LongPathsEnabled'
            Details: 'DWORD (0x00000001)'
        condition: selection
    falsepositives:
        - Unknown
    level: high
    regression_tests_path: regression_data/rules-emerging-threats/2021/Malware/BlackByte/registry_set_win_malware_blackbyte_privesc_registry/info.yml
