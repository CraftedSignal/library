        product: windows
    detection:
        selection_winzip:
            CommandLine|contains:
                - 'winzip.exe'
                - 'winzip64.exe'
        selection_password:
            CommandLine|contains: '-s"'
        selection_other:
            CommandLine|contains:
                - ' -min '
                - ' -a '
        condition: all of selection*
    falsepositives:
