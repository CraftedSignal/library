        - detection.threat-hunting
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains:
                - 'Remove-Item -Path '
                - 'del -Path '
                - 'erase -Path '
                - 'rd -Path '
                - 'ri -Path '
                - 'rm -Path '
                - 'rmdir -Path '
        condition: selection
    falsepositives:
        - Legitimate PowerShell scripts
    level: low
