    logsource:
        category: antivirus
    detection:
        selection:
            Signature|contains:
                - 'ATK/Cobalt'
                - 'Backdoor.Cobalt'
                - 'Beacon'
                - 'Brutel'
                - 'BruteR'
                - 'CbltStr'
                - 'CobaltStr'
                - 'COBALT.SMD'
                - 'COBEACON'
                - 'Cometer'
                - 'Exploit.Script.CVE'
                - 'IISExchgSpawnCMD'
                - 'Metasploit'
                - 'Meterpreter'
                - 'MeteTool'
                - 'Mpreter'
                - 'MsfShell'
                - 'PowerSploit'
                - 'Razy'
                - 'Rozena'
                - 'Sbelt'
                - 'Seatbelt'
                - 'Sliver'
                - 'Swrort'
        condition: selection
    falsepositives:
        - Unlikely
    level: critical
