name: Antivirus - Exploitation Framework Signature
description: |
    Detects a highly relevant Antivirus alert that reports an exploitation framework.
    This event must not be ignored just because the AV has blocked the malware but investigate, how it came there in the first place.
query: |
    title: Antivirus - Exploitation Framework Signature
    id: 238527ad-3c2c-4e4f-a1f6-92fd63adb864
    status: stable
    description: |
        Detects a highly relevant Antivirus alert that reports an exploitation framework.
        This event must not be ignored just because the AV has blocked the malware but investigate, how it came there in the first place.
    references:
        - https://www.nextron-systems.com/?s=antivirus
