    tags:
        - attack.command-and-control
        - attack.stealth
        - attack.t1219.002
        - attack.t1036.003
    logsource:
        category: process_creation
        product: macos
    detection:
        selection_meshagent:
            - CommandLine|contains: '--meshServiceName'
            - OriginalFileName|contains: 'meshagent'
        filter_main_legitimate:
            Image|endswith:
                - '/meshagent'
                - '/meshagent_osx64'
        condition: selection_meshagent and not 1 of filter_main_*
    falsepositives:
        - Unknown
    level: high
