    tags:
        - attack.execution
        - attack.t1047
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            ParentImage|endswith: '\scrcons.exe'
            Image|endswith:
                - '\svchost.exe'
                - '\dllhost.exe'
                - '\powershell.exe'
                - '\pwsh.exe'
                - '\wscript.exe'
                - '\cscript.exe'
                - '\schtasks.exe'
                - '\regsvr32.exe'
                - '\mshta.exe'
                - '\rundll32.exe'
                - '\msiexec.exe'
                - '\msbuild.exe'
        condition: selection
    falsepositives:
        - Unknown
    level: high
