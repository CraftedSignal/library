    tags:
        - attack.stealth
        - attack.t1070
    logsource:
        category: file_delete
        product: windows
    detection:
        selection:
            TargetFilename|startswith: 'C:\Windows\System32\winevt\Logs\'
            TargetFilename|endswith: '.evtx'
        condition: selection
    falsepositives:
