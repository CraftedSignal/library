    logsource:
        product: windows
        service: system
    detection:
        selection:
            Provider_Name: 'Service Control Manager'
            EventID: 7045
            ImagePath|contains|all:
                - 'new-object'
                - 'text.encoding]::ascii'
                - 'readtoend'
            ImagePath|contains:
                - ':system.io.compression.deflatestream'
                - 'system.io.streamreader'
        condition: selection
    falsepositives:
        - Unknown
    level: medium
