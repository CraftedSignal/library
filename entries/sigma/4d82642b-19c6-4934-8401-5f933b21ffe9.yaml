id: 4d82642b-19c6-4934-8401-5f933b21ffe9
name: PHP Code Markers in PHP Session File Content
description: >-
    Detects PHP opening tags in collected content of files under common PHP
    session locations, including hashed subdirectory layouts. This can indicate
    session-file poisoning, but it does not establish that the file was included
    or executed. This generic session-content detection is not specific to the
    php2shell CVEs.
query: |
    title: PHP Code Markers in PHP Session File Content
    id: 4d82642b-19c6-4934-8401-5f933b21ffe9
    status: experimental
    description: >-
        Detects PHP opening tags in collected content of files under common PHP
        session locations, including hashed subdirectory layouts. This can indicate
        session-file poisoning, but it does not establish that the file was included
        or executed. This generic session-content detection is not specific to the
        php2shell CVEs.
    author: Qi Deng (@ikow), adapted by OpenAI
    date: 2026-10-21
    modified: 2026-10-22
    references:
        - https://www.php.net/manual/en/session.upload-progress.php
        - https://www.php.net/manual/en/session.configuration.php
    logsource:
        category: file_event
        product: linux
        definition: >-
            Requires file creation or modification events enriched with the actual
            file text in a custom FileContent field, paired with TargetFilename in
            the same event. Ordinary Sysmon or auditd file metadata is insufficient.
            Regex conversion support is required. Adapt selection_path to
            session.save_path when it does not use a session, sessions, or tmp
            directory. Content collection can miss short-lived files.
    detection:
        selection_path:
            TargetFilename|re: '/(session|sessions|tmp)/([^/]+/)*sess_[^/]+$'
        selection_content:
            FileContent|contains:
                - '<?php'
                - '<?='
        condition: selection_path and selection_content
    fields:
        - TargetFilename
        - FileContent
    falsepositives:
        - Applications legitimately storing PHP code snippets or editor drafts in sessions
        - Development environments and authorized security testing
    level: high
query_type: sigma
