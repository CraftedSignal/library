        service: system
    detection:
        selection_eid:
            Provider_Name: 'Service Control Manager'
            EventID: 7045
        selection_img_paths:
            - ImagePath|re: '^[Cc]:\\[Pp]rogram[Dd]ata\\.{1,9}\.exe'
            - ImagePath|re: '^[Cc]:\\.{1,9}\.exe'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: high
