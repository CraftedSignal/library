        - attack.impact
    logsource:
        product: windows
        category: ps_module
        definition: 0ad03ef1-f21b-4a79-8ce8-e6900c54b65b
    detection:
        selection_cmdlet:
            Payload|contains:
                - 'Import-Module '
                - 'ipmo '
        selection_dll:
            Payload|contains: 'Microsoft.ActiveDirectory.Management.dll'
        condition: all of selection_*
    falsepositives:
        - Legitimate use of the library for administrative activity
    level: medium
