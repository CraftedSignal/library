    author: frack113
    date: 2022-02-01
    tags:
        - attack.defense-impairment
        - attack.t1553.005
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains|all:
                - 'Mount-DiskImage '
                - '-ImagePath '
        condition: selection
    falsepositives:
