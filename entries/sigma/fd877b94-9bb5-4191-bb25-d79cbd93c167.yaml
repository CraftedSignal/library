    detection:
        selection_img:
            - Image|endswith: '\reg.exe'
            - OriginalFileName: 'reg.exe'
        selection_cli_flag:
            CommandLine|contains:
                - ' save '
                - ' export '
                - ' ˢave '
                - ' eˣport '
        selection_cli_hklm:
            CommandLine|contains:
                - 'hklm'
                - 'hk˪m'
                - 'hkey_local_machine'
                - 'hkey_˪ocal_machine'
                - 'hkey_loca˪_machine'
                - 'hkey_˪oca˪_machine'
        selection_cli_hive:
            CommandLine|contains:
                - '\system'
                - '\sam'
                - '\security'
                - '\ˢystem'
                - '\syˢtem'
                - '\ˢyˢtem'
                - '\ˢam'
                - '\ˢecurity'
        condition: all of selection_*
    falsepositives:
        - Dumping hives for legitimate purpouse i.e. backup or forensic investigation
    level: high
