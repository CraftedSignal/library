    tags:
        - attack.command-and-control
        - attack.t1071.004
    logsource:
        category: dns
    detection:
        selection:
            record_type: 'TXT'
            answer|contains:
                - 'IEX'
                - 'Invoke-Expression'
                - 'cmd.exe'
        condition: selection
    falsepositives:
        - Unknown
    level: high
