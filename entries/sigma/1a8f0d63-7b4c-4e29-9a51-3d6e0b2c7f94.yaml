id: 1a8f0d63-7b4c-4e29-9a51-3d6e0b2c7f94
name: PowerShell Invoking LLM Provider API (Runtime Command Generation)
description: |
    Detects PowerShell process creation whose command line contains an LLM provider API host together with a
    web-request cmdlet. Runtime AI-malware such as FRUITSHELL (PowerShell reverse shell with detection-bypass
    prompts) and command-generation stealers (PROMPTSTEAL/LAMEHUG behavior ported to PowerShell) fetch attacker
    prompts and/or generated commands from an LLM API and execute them, keeping malicious logic out of the binary.
query: |
    title: PowerShell Invoking LLM Provider API (Runtime Command Generation)
    name: powershell_llm_api_command_generation
    id: 1a8f0d63-7b4c-4e29-9a51-3d6e0b2c7f94
    status: experimental
    description: |
        Detects PowerShell process creation whose command line contains an LLM provider API host together with a
        web-request cmdlet. Runtime AI-malware such as FRUITSHELL (PowerShell reverse shell with detection-bypass
        prompts) and command-generation stealers (PROMPTSTEAL/LAMEHUG behavior ported to PowerShell) fetch attacker
        prompts and/or generated commands from an LLM API and execute them, keeping malicious logic out of the binary.
    references:
        - https://cloud.google.com/blog/topics/threat-intelligence/threat-actor-usage-of-ai-tools
        - https://firsthackersnews.com/google-discovers-promptflux-ai-malware-using-gemini-api/
        - https://atlas.mitre.org/techniques/AML.T0096
    author: Raymond DePalma (@depalmar)
    date: 2026-08-12
    tags:
        - attack.execution
        - attack.t1059.001
        - attack.command-and-control
        - atlas.aml-t0096
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_ps:
            Image|endswith:
                - '\powershell.exe'
                - '\pwsh.exe'
            ParentImage|endswith:
                - '\powershell.exe'
                - '\pwsh.exe'
                - '\cmd.exe'
                - '\wscript.exe'
                - '\cscript.exe'
                - '\mshta.exe'
                - '\explorer.exe'
        selection_host:
            CommandLine|contains:
                - 'generativelanguage.googleapis.com'
                - 'api-inference.huggingface.co'
                - 'api.anthropic.com'
                - 'api.openai.com'
                - 'api.deepseek.com'
                - 'openrouter.ai'
                - 'openai.azure.com'
        selection_web:
            CommandLine|contains:
                - 'Invoke-WebRequest'
                - 'Invoke-RestMethod'
                - 'IWR'
                - 'IRM'
                - 'System.Net.WebClient'
                - 'System.Net.Http'
                - 'curl '
        condition: selection_ps and selection_host and selection_web
    falsepositives:
        - Developer PowerShell sessions or automation legitimately calling LLM APIs. Allowlist by user/host/signed script.
    level: medium
query_type: sigma
severity: medium
