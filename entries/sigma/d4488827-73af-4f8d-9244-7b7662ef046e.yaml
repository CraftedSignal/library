    tags:
        - attack.command-and-control
        - attack.t1071.001
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection_webrequest:
            ScriptBlockText|contains:
                - 'Invoke-WebRequest'
                - 'Invoke-RestMethod'
                - ' irm ' # Space before and after to avoid false positives with 'irm' as a variable
                - 'iwr '
        selection_useragent:
            ScriptBlockText|contains: '-UserAgent '
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: medium
    regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_invoke_webrequest_useragent/info.yml
