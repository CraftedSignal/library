    tags:
        - attack.execution
        - attack.t1059
        - attack.initial-access
        - attack.t1190
        - cve.2023-22518
        - detection.emerging-threats
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_parent:
            ParentImage|endswith:
                - '\tomcat8.exe'
                - '\tomcat9.exe'
                - '\tomcat10.exe'
            ParentCommandLine|contains: 'confluence'
        selection_child:
            # Note: Only children associated with known campaigns
            - Image|endswith:
                  - '\cmd.exe'
                  - '\powershell.exe'
            - OriginalFileName:
                  - 'Cmd.Exe'
                  - 'PowerShell.EXE'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: medium
