    modified: 2022-07-14
    tags:
        - attack.execution
        - attack.stealth
        - attack.t1127
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            Image|endswith: '\csi.exe'
            ParentImage|endswith:
                - '\powershell.exe'
                - '\pwsh.exe'
                - '\powershell_ise.exe'
            OriginalFileName: 'csi.exe'
        condition: selection
    falsepositives:
        - Possible depending on environment. Pair with other factors such as net connections, command-line args, etc.
    level: high
