        - attack.privilege-escalation
        - attack.persistence
        - attack.t1546.015
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains|all:
                - '::GetTypeFromCLSID('
                - '.ShellExecute('
        condition: selection
    falsepositives:
        - Legitimate PowerShell scripts
    level: medium
