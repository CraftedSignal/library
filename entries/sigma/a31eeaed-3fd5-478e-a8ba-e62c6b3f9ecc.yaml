id: a31eeaed-3fd5-478e-a8ba-e62c6b3f9ecc
name: Raccine Uninstall
description: Detects commands that indicate a Raccine removal from an end system. Raccine is a free ransomware protection tool.
query: |
    title: Raccine Uninstall
    id: a31eeaed-3fd5-478e-a8ba-e62c6b3f9ecc
    status: test
    description: Detects commands that indicate a Raccine removal from an end system. Raccine is a free ransomware protection tool.
    references:
        - https://github.com/Neo23x0/Raccine
    author: Florian Roth (Nextron Systems)
    date: 2021-01-21
    modified: 2022-10-09
    tags:
        - attack.defense-impairment
        - attack.t1685
    logsource:
        category: process_creation
        product: windows
    detection:
        selection1:
            CommandLine|contains|all:
                - 'taskkill '
                - 'RaccineSettings.exe'
        selection2:
            CommandLine|contains|all:
                - 'reg.exe'
                - 'delete'
                - 'Raccine Tray'
        selection3:
            CommandLine|contains|all:
                - 'schtasks'
                - '/DELETE'
                - 'Raccine Rules Updater'
        condition: 1 of selection*
    falsepositives:
        - Legitimate deinstallation by administrative staff
    level: high
query_type: sigma
severity: high
