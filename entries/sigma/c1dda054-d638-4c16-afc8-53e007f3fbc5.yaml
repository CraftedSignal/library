name: Automated Collection Command PowerShell
description: Once established within a system or network, an adversary may use automated techniques for collecting internal data.
query: |
    title: Automated Collection Command PowerShell
    id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    status: test
    description: Once established within a system or network, an adversary may use automated techniques for collecting internal data.
    references:
        - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
    author: frack113
    date: 2021-07-28
    modified: 2022-12-25
    tags:
        - attack.collection
        - attack.t1119
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection_ext:
            ScriptBlockText|contains:
                - '.doc'
                - '.docx'
                - '.xls'
                - '.xlsx'
                - '.ppt'
                - '.pptx'
                - '.rtf'
                - '.pdf'
                - '.txt'
        selection_cmd:
            ScriptBlockText|contains|all:
                - 'Get-ChildItem'
                - ' -Recurse '
                - ' -Include '
        condition: all of selection*
    falsepositives:
        - Unknown
    level: medium
    regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_automated_collection/info.yml
