id: 4dbc580c-f70d-4285-aaa7-bec4bebdccde
name: Command Shell from Wing FTP Server
description: Detects execution of a command shell with Wing FTP Server as a Parent Process.
query: |-
    title: Command Shell from Wing FTP Server
    id: 4dbc580c-f70d-4285-aaa7-bec4bebdccde
    status: experimental
    description: Detects execution of a command shell with Wing FTP Server as a Parent Process.
    author: Craig Sweeney, Tanner Filip, Matt Anderson, John Hammond (Huntress)
    references:
     - https://www.rcesecurity.com/2025/06/what-the-null-wing-ftp-server-rce-cve-2025-47812/
    date: 2025-07-01
    logsource:
      category: process_creation
      product: windows
    detection:
     shell_process:
      Image|endswith: '\cmd.exe'
     selection_parent:
      ParentImage|endswith: '\wftpserver.exe'
     condition: shell_process and selection_parent
    falsepositives:
     - Unknown
    level: high
    tags:
      - attack.initial_access
      - attack.execution
