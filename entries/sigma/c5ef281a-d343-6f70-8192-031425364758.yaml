id: c5ef281a-d343-6f70-8192-031425364758
name: M365 Copilot - Bulk-Extraction Prompt Keywords
description: |
    Detects Copilot prompts containing bulk-extraction keywords such as
    "list all", "summarize all", "export everything", "all emails
    containing". These patterns indicate intent to aggregate large volumes
    of organizational content — the Copilot-as-exfiltration-tool pattern.

    Prompt content is only available in DSPM for AI activity-explorer
    events (not the standard Unified Audit Log). Requires E5 Compliance
    licensing and DSPM for AI enabled.
query: |
    title: M365 Copilot - Bulk-Extraction Prompt Keywords
    id: c5ef281a-d343-6f70-8192-031425364758
    status: experimental
    description: |
      Detects Copilot prompts containing bulk-extraction keywords such as
      "list all", "summarize all", "export everything", "all emails
      containing". These patterns indicate intent to aggregate large volumes
      of organizational content — the Copilot-as-exfiltration-tool pattern.

      Prompt content is only available in DSPM for AI activity-explorer
      events (not the standard Unified Audit Log). Requires E5 Compliance
      licensing and DSPM for AI enabled.
    references:
      - https://atlas.mitre.org/techniques/AML.T0086
    author: Raymond DePalma (ai-dfir-toolkit)
    date: 2026-04-15
    tags:
      - attack.collection
      - attack.atlas.t0086
      - owasp.llm02
    logsource:
      product: m365
      service: dspm_ai
    detection:
      selection_activity:
        ActivityType: 'CopilotInteraction'
      selection_prompt:
        Prompt|contains:
          - 'list all'
          - 'summarize all'
          - 'export everything'
          - 'all emails containing'
          - 'all files about'
          - 'all conversations with'
          - 'every document'
          - 'compile a report of all'
          - 'give me everything'
      condition: all of selection_*
    fields:
      - AccountObjectId
      - IPAddress
      - Prompt
    falsepositives:
      - Legitimate research / audit queries
      - Compliance teams genuinely collecting cross-tenant information
    level: medium
query_type: sigma
severity: medium
