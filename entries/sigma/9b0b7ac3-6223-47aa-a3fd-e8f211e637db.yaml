    modified: 2024-03-13
    tags:
        - attack.privilege-escalation
        - attack.persistence
        - attack.execution
        - attack.stealth
        - attack.t1574.011
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            Image|endswith: '\reg.exe'
            CommandLine|contains|all:
                - 'add '
                - 'SYSTEM\CurrentControlSet\Services\'
                - ' ImagePath '
        selection_value:
            CommandLine|contains|windash: ' -d '
        condition: all of selection*
    falsepositives:
        - Unknown
    level: medium
