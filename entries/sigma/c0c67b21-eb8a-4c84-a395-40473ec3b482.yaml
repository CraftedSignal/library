    logsource:
        category: registry_set
        product: windows
    detection:
        selection:
            TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
            TargetObject|endswith:
                - '\Sens Api'
                - '\OneDrive'
            Details|contains|all:
                - ':\WINDOWS\system32\rundll32.exe'
                - '.wll'
                - '#1'
        condition: selection
    falsepositives:
        - Unknown
    level: high
