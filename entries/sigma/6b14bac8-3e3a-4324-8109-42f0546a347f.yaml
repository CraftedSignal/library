    tags:
        - attack.execution
        - attack.persistence
        - attack.privilege-escalation
        - attack.t1053.003
    logsource:
        category: process_creation
        product: linux
    detection:
        selection:
            Image|endswith: 'crontab'
            CommandLine|contains: '/tmp/'
        condition: selection
    falsepositives:
        - Legitimate administration activities
    level: medium
