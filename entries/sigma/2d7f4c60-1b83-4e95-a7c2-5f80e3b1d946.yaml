id: 2d7f4c60-1b83-4e95-a7c2-5f80e3b1d946
name: Agent Tool Invocation at Machine Tempo
description: |
    Detects MCP/agent tool invocations occurring at a rate no human operator could drive. In the GTG-1002
    campaign Anthropic disclosed (Nov 2025), Claude Code plugged into MCP servers executed 80-90% of the
    tactical work and sustained request rates reported as "thousands of requests per second" across ~30
    targets, with human operators intervening at only 4-6 decision points per campaign. Tempo is therefore
    one of the few reliable discriminators between an analyst using an agent and an adversary orchestrating one.
    This rule counts tool-invocation events per source in a short window; tune `count` to your baseline.
    For the richer behavioural picture (phase progression, breadth, autonomy ratio, exfil data-flow), run
    `analyze_agent_traces.py` in this directory over the collected session traces.
query: |
    title: Agent Tool Invocation at Machine Tempo
    name: agent_tool_invocation_tempo_base
    id: 2d7f4c60-1b83-4e95-a7c2-5f80e3b1d946
    status: experimental
    description: |
