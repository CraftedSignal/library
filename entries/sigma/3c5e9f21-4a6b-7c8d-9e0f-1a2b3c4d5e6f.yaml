id: 3c5e9f21-4a6b-7c8d-9e0f-1a2b3c4d5e6f
name: AWS Bedrock - Excessive Token Consumption
description: |
    Detects abnormally high token consumption on AWS Bedrock model
    invocations, indicating cost-based denial of service (LLM06), model
    extraction attempts, or runaway agentic loops. Requires Bedrock model
    invocation logging enabled (CloudWatch log group /aws/bedrock with
    schemaType=ModelInvocationLog) — logging is OFF by default.
query: |
    title: AWS Bedrock - Excessive Token Consumption
    id: 3c5e9f21-4a6b-7c8d-9e0f-1a2b3c4d5e6f
    status: experimental
    description: |
      Detects abnormally high token consumption on AWS Bedrock model
      invocations, indicating cost-based denial of service (LLM06), model
      extraction attempts, or runaway agentic loops. Requires Bedrock model
      invocation logging enabled (CloudWatch log group /aws/bedrock with
      schemaType=ModelInvocationLog) — logging is OFF by default.
    references:
      - https://genai.owasp.org/llmrisk/llm10-unbounded-consumption/
      - https://atlas.mitre.org/techniques/AML.T0029
      - https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
    author: Raymond DePalma (ai-dfir-toolkit)
    date: 2026-04-15
    tags:
      - attack.impact
      - attack.atlas.t0029
      - owasp.llm10
    logsource:
      product: aws
      service: bedrock
    detection:
      selection_schema:
        schemaType: 'ModelInvocationLog'
      selection_excessive:
        output.outputBodyJson.usage.output_tokens|gte: 50000
      selection_anomalous_ratio:
        output.outputBodyJson.usage.input_tokens|lte: 100
        output.outputBodyJson.usage.output_tokens|gte: 10000
      condition: selection_schema and (selection_excessive or selection_anomalous_ratio)
    fields:
      - identity.arn
      - modelId
      - input.inputBodyJson.prompt
      - output.outputBodyJson.usage.input_tokens
      - output.outputBodyJson.usage.output_tokens
    falsepositives:
      - Legitimate batch summarization or long-document RAG workloads
      - Code generation tasks producing large outputs
      - Multi-step agentic reasoning workflows
    level: medium
query_type: sigma
severity: medium
