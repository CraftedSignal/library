    author: Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
    date: 2025-11-01
    tags:
        - attack.persistence
        - attack.t1136.001
    logsource:
        product: fortigate
        service: event
    detection:
        selection:
            action: 'Add'
            cfgpath: 'system.admin'
        condition: selection
    falsepositives:
        - An administrator account can be created for legitimate purposes. Investigate the account details to determine if it is authorized.
    level: medium
