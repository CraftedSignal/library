                - '\curl.exe'
                - '\ExtExport.exe'
                - '\KeyScramblerLogon.exe'
                - '\wmprph.exe'
            TargetFilename|endswith: '\Autoit3.exe'
        condition: selection
    falsepositives:
        - Unknown
    level: medium
