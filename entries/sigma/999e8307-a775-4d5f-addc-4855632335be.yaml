name: Potential BlackByte Ransomware Activity
description: Detects command line patterns used by BlackByte ransomware in different operations
query: |
    title: Potential BlackByte Ransomware Activity
    id: 999e8307-a775-4d5f-addc-4855632335be
    status: test
    description: Detects command line patterns used by BlackByte ransomware in different operations
    references:
        - https://redcanary.com/blog/blackbyte-ransomware/
    author: Florian Roth (Nextron Systems)
    date: 2022-02-25
    modified: 2023-02-08
    tags:
        - attack.execution
        - attack.impact
        - attack.stealth
        - attack.t1485
        - attack.t1498
        - attack.t1059.001
        - attack.t1140
        - detection.emerging-threats
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_1:
            Image|startswith: 'C:\Users\Public\'
            CommandLine|contains: ' -single '
        selection_2:
            CommandLine|contains:
                - 'del C:\Windows\System32\Taskmgr.exe'
                - ';Set-Service -StartupType Disabled $'
                - 'powershell -command "$x =[System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String('
                - ' do start wordpad.exe /p '
        condition: 1 of selection_*
    falsepositives:
        - Unknown
    level: high
    regression_tests_path: regression_data/rules-emerging-threats/2021/Malware/BlackByte/proc_creation_win_malware_blackbyte_ransomware/info.yml
