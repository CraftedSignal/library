        category: file_event
        product: windows
    detection:
        selection:
            TargetFilename|endswith:
                - '.kirbi' # Kerberos tickets
                - 'mimilsa.log' # MemSSP default file
        condition: selection
    falsepositives:
        - Unlikely
    level: critical
