id: 92bbf587-a010-3c4d-5e6f-708192031425
name: M365 Copilot Activity from Unmanaged Device
description: |
    Detects Copilot interactions from devices flagged as non-compliant
    or unmanaged. Catches BYOD or compromised-endpoint access to Copilot
    after enterprise AI permissions have been granted.
query: |
    title: M365 Copilot Activity from Unmanaged Device
    id: 92bbf587-a010-3c4d-5e6f-708192031425
    status: experimental
    description: |
      Detects Copilot interactions from devices flagged as non-compliant
      or unmanaged. Catches BYOD or compromised-endpoint access to Copilot
      after enterprise AI permissions have been granted.
    references:
      - https://atlas.mitre.org/techniques/AML.T0086
    author: Raymond DePalma (ai-dfir-toolkit)
    date: 2026-04-15
    tags:
      - attack.initial_access
      - attack.atlas.t0086
    logsource:
      product: m365
      service: audit
    detection:
      selection_operation:
        Operation:
          - 'CopilotInteraction'
          - 'AIAppInteraction'
      selection_unmanaged:
        DeviceProperties.IsCompliantAndManaged: 'False'
      condition: all of selection_*
    fields:
      - UserId
      - ClientIP
      - AppHost
      - DeviceProperties
      - UserAgent
    falsepositives:
      - Authorized BYOD scenarios
      - Device compliance telemetry lag (fresh enrollments may register as unmanaged briefly)
    level: medium
query_type: sigma
severity: medium
tags:
    - attack.initial_access
    - attack.atlas.t0086
