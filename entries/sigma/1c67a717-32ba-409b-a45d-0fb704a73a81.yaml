    modified: 2023-02-21
    tags:
        - attack.discovery
        - attack.t1049
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith:
                  - '\net.exe'
                  - '\net1.exe'
            - OriginalFileName:
                  - 'net.exe'
                  - 'net1.exe'
        selection_cli:
            - CommandLine|endswith:
                  - ' use'
                  - ' sessions'
            - CommandLine|contains:
                  - ' use '
                  - ' sessions '
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: low
