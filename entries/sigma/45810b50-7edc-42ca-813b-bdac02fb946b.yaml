id: 45810b50-7edc-42ca-813b-bdac02fb946b
name: Steganography Hide Zip Information in Picture File
description: Detects appending of zip file to image
query: |
    title: Steganography Hide Zip Information in Picture File
    id: 45810b50-7edc-42ca-813b-bdac02fb946b
    status: test
    description: Detects appending of zip file to image
    references:
        - https://zerotoroot.me/steganography-hiding-a-zip-in-a-jpeg-file/
    author: 'Pawel Mazur'
    date: 2021-09-09
    modified: 2022-10-09
    tags:
        - attack.stealth
        - attack.t1027.003
    logsource:
        product: linux
        service: auditd
    detection:
        commands:
            type: EXECVE
            a0: cat
        a1:
            a1|endswith:
                - '.jpg'
                - '.png'
        a2:
            a2|endswith: '.zip'
        condition: commands and a1 and a2
    falsepositives:
        - Unknown
    level: low
