    modified: 2023-01-06
    tags:
        - attack.persistence
        - attack.privilege-escalation
        - attack.t1546.013
    logsource:
        product: windows
        category: file_event
    detection:
        selection:
            TargetFilename|endswith: '\Microsoft.VSCode_profile.ps1'
        condition: selection
    falsepositives:
