    modified: 2023-12-15
    tags:
        - attack.defense-impairment
        - attack.t1685
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            CommandLine|contains|all:
                - '\Services\VSS\Diag'
                - '/d Disabled'
        condition: selection
    falsepositives:
