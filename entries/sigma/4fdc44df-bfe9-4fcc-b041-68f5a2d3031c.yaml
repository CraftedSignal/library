        - attack.persistence
        - attack.t1098
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains:
                - 'Disable-LocalUser'
                - 'Enable-LocalUser'
                - 'Get-LocalUser'
                - 'Set-LocalUser'
                - 'New-LocalUser'
                - 'Rename-LocalUser'
                - 'Remove-LocalUser'
        condition: selection
    falsepositives:
        - Legitimate administrative script
    level: medium
    regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_localuser/info.yml
