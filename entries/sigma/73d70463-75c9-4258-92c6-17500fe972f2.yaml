    logsource:
        category: process_creation
        product: windows
    detection:
        selection_1:
            CommandLine|contains: 'setup0.exe -p'
        selection_2:
            CommandLine|contains: 'setup.exe'
            CommandLine|endswith:
                - '-x:0'
                - '-x:1'
                - '-x:2'
        condition: 1 of selection_*
    falsepositives:
        - Legitimate setups that use similar flags
    level: critical
