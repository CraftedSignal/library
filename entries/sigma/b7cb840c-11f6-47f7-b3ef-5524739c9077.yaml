    tags:
        - attack.initial-access
        - attack.t1195.002
        - attack.command-and-control
        - attack.t1105
        - detection.emerging-threats
    logsource:
        category: file_event
        product: linux
    detection:
        selection:
            Image|endswith: '/curl'
            TargetFilename: '/tmp/ld.py'
        condition: selection
    falsepositives:
        - Highly unlikely
    level: high
