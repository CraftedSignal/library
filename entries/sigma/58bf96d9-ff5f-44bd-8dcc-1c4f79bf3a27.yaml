    tags:
        - attack.execution
        - attack.t1559
        - detection.emerging-threats
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            Image|endswith: '\wermgr.exe'
            ParentImage|endswith: '\rundll32.exe'
            ParentCommandLine|contains: 'DllRegisterServer'
        condition: selection
    falsepositives:
        - Unknown
    level: high
