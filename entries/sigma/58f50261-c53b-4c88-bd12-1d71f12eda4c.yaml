    detection:
        selection_img:
            - Image|endswith: '\VaultCmd.exe'
            - OriginalFileName: 'VAULTCMD.EXE'
        selection_cli:
            CommandLine|contains: '/listcreds:'
        condition: all of selection*
    falsepositives:
