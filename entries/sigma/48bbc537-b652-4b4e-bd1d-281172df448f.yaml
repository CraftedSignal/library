    modified: 2026-06-29
    tags:
        - attack.privilege-escalation
        - attack.discovery
        - attack.persistence
        - attack.t1543.003
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            - OriginalFileName: 'pssuspend.exe'
            - Image|endswith:
                  - '\pssuspend.exe'
                  - '\pssuspend64.exe'
                  - '\pssuspend64a.exe'
        condition: selection
    falsepositives:
        - Unknown
    level: medium
