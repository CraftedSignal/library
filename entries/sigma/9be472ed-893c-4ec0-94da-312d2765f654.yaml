                - '$%7Bjndi:'
                - '%2524%257Bjndi'
                - '%2F%252524%25257Bjndi%3A'
                - '${jndi:${lower:'
                - '${::-j}${'
                - '${jndi:nis'
                - '${jndi:nds'
                - '${jndi:corba'
                - '${jndi:iiop'
                - 'Reference Class Name: foo'
                - '${${env:BARFOO:-j}'
                - '${::-l}${::-d}${::-a}${::-p}'
                - '${base64:JHtqbmRp'
                - '${${env:ENV_NAME:-j}ndi${env:ENV_NAME:-:}$'
                - '${${lower:j}ndi:'
                - '${${upper:j}ndi:'
                - '${${::-j}${::-n}${::-d}${::-i}:'
