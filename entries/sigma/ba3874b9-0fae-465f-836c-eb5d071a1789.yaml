    detection:
        selection_img:
            - Image|endswith: '\node.exe'
            - OriginalFileName: 'node.exe'
            - Product: 'Node.js'
        selection_cmd:
            CommandLine|contains: '.js'
        condition: all of selection_*
    falsepositives:
        - Legitimate use of node.exe to execute JavaScript or JSC files on your environment
    level: low
