id: a805d365-a3fc-485b-ac64-262cd9568538
name: Suspicious Command from Node.Js
description: Detects execution of a Cmd process from a parent Node Process, with a suspicious enumeration or output command such as "whoami" or "systeminfo". This is a possible indication of exploitation of Meta React Server Components vulnerability identified as CVE-2025-55182, "React2Shell".
query: "title: Suspicious Command from Node.Js\nid: a805d365-a3fc-485b-ac64-262cd9568538\nstatus: experimental\ndescription: Detects execution of a Cmd process from a parent Node Process, with a suspicious enumeration or output command such as \"whoami\" or \"systeminfo\". \n             This is a possible indication of exploitation of Meta React Server Components vulnerability identified as CVE-2025-55182, \"React2Shell\". \nauthor: Craig Sweeney, Anna Pham, Michael Tigges, Matt Anderson, Andrew Schwartz (Huntress)\nreferences:\n - https://www.cisa.gov/news-events/alerts/2025/12/05/cisa-adds-one-known-exploited-vulnerability-catalog\n - https://www.wiz.io/blog/critical-vulnerability-in-react-cve-2025-55182\n - https://aws.amazon.com/blogs/security/china-nexus-cyber-threat-groups-rapidly-exploit-react2shell-vulnerability-cve-2025-55182/\n - https://nvd.nist.gov/vuln/detail/CVE-2025-55182\ndate: 2025-12-08\nlogsource:\n  category: process_creation\n  product: windows\ndetection:\n shell_process:\n  Image|endswith: '\\cmd.exe'\n shell_command:\n  CommandLine|contains:\n    - 'whoami'\n    - 'systeminfo'\n    - 'quser'\n    - 'echo'\n selection_parent:\n  ParentImage|endswith: '\\nodejs\\node.exe'\n condition: shell_process and shell_command and selection_parent\nfalsepositives:\n - Unknown\nlevel: medium\ntags:\n  - attack.initial_access\n  - attack.execution\n  - attack.discovery\n  - attack.t1059.003\n  - attack.t1190\n  - attack.t1082\n  - attack.t1033\n  - attack.ta0001\n  - attack.ta0002\n  - attack.ta0007"
