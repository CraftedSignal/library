        - attack.impact
    logsource:
        product: gcp
        service: google_workspace.admin
    detection:
        selection:
            eventService: admin.googleapis.com
            eventName:
                - DELETE_ROLE
                - RENAME_ROLE
                - UPDATE_ROLE
        condition: selection
    falsepositives:
        - Unknown

    level: medium
