id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
name: Suspicious Scheduled Task Creation Involving Temp Folder
description: Detects the creation of scheduled tasks that involves a temporary folder and runs only once
query: |
    title: Suspicious Scheduled Task Creation Involving Temp Folder
    id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    status: test
    description: Detects the creation of scheduled tasks that involves a temporary folder and runs only once
    references:
        - https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289/3
    author: Florian Roth (Nextron Systems)
    date: 2021-03-11
    modified: 2022-10-09
    tags:
        - attack.privilege-escalation
        - attack.execution
        - attack.persistence
        - attack.t1053.005
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            Image|endswith: '\schtasks.exe'
            CommandLine|contains|all:
                - ' /create '
                - ' /sc once '
                - '\Temp\'
        condition: selection
    falsepositives:
        - Administrative activity
        - Software installation
    level: high
