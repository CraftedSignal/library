        - attack.t1048.003
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            ParentImage|endswith: '\svchost.exe'
            Image|endswith: '\rundll32.exe'
            CommandLine|contains|all:
                - 'C:\windows\system32\davclnt.dll,DavSetCookie'
                - '.WAV'
        condition: selection
    falsepositives:
        - unknown
    level: high

