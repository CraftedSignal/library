id: db014773-d9d9-4792-91e5-133337c0ffee
name: AWS IAM S3Browser User or AccessKey Creation
description: Detects S3 Browser utility creating IAM User or AccessKey.
query: |
    title: AWS IAM S3Browser User or AccessKey Creation
    id: db014773-d9d9-4792-91e5-133337c0ffee
    status: test
    description: Detects S3 Browser utility creating IAM User or AccessKey.
    references:
        - https://permiso.io/blog/s/unmasking-guivil-new-cloud-threat-actor
    author: daniel.bohannon@permiso.io (@danielhbohannon)
    date: 2023-05-17
    tags:
        - attack.privilege-escalation
        - attack.execution
        - attack.persistence
        - attack.initial-access
        - attack.stealth
        - attack.t1059.009
        - attack.t1078.004
    logsource:
        product: aws
        service: cloudtrail
    detection:
        selection:
            eventSource: 'iam.amazonaws.com'
            eventName:
                - 'CreateUser'
                - 'CreateAccessKey'
            userAgent|contains: 'S3 Browser'
        condition: selection
    falsepositives:
        - Valid usage of S3 Browser for IAM User and/or AccessKey creation
    level: high
query_type: sigma
severity: high
techniques:
    - T1059.009
    - T1078.004
