    date: 2022-06-03
    tags:
        - attack.execution
        - attack.t1059
    logsource:
        category: process_creation
        product: linux
    detection:
        selection:
            ParentImage|endswith: '/java'
            CommandLine|contains:
                - '/bin/sh'
                - 'bash'
                - 'dash'
                - 'ksh'
                - 'zsh'
                - 'csh'
                - 'fish'
                - 'curl'
                - 'wget'
                - 'python'
        condition: selection
    falsepositives:
        - Unknown
    level: high
