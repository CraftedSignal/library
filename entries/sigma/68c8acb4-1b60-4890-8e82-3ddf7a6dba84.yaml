    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - OriginalFileName: 'HH.exe'
            - Image|endswith: '\hh.exe'
        selection_cli:
            CommandLine|contains: '.chm'
        condition: all of selection_*
    falsepositives:
        - False positives are expected with legitimate ".CHM"
