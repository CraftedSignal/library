    date: 2023-06-02
    modified: 2025-08-05
    tags:
        - attack.stealth
        - attack.t1036
    logsource:
        product: linux
        category: process_creation
    detection:
        selection:
            Image|startswith: '/tmp/'
        filter_optional_nextcloud:
            Image|endswith: '/usr/bin/nextcloud'
        condition: selection and not 1 of filter_optional_*
    falsepositives:
        - Unknown
    level: medium
