    date: 2019-04-03
    modified: 2023-03-29
    tags:
        - attack.execution
        - attack.t1047
        - attack.t1059.001
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_parent:
            ParentImage|endswith: '\WmiPrvSE.exe'
        selection_img:
            - Image|endswith:
                  - '\powershell.exe'
                  - '\pwsh.exe'
            - OriginalFileName:
                  - 'PowerShell.EXE'
                  - 'pwsh.dll'
        condition: all of selection_*
    falsepositives:
        - AppvClient
        - CCM
        - WinRM
    level: medium
