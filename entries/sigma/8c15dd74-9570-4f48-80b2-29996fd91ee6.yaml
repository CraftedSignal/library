id: 8c15dd74-9570-4f48-80b2-29996fd91ee6
name: Goofy Guineapig Backdoor Service Creation
description: Detects service creation persistence used by the Goofy Guineapig backdoor
query: |
    title: Goofy Guineapig Backdoor Service Creation
    id: 8c15dd74-9570-4f48-80b2-29996fd91ee6
    status: test
    description: Detects service creation persistence used by the Goofy Guineapig backdoor
    references:
        - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/goofy-guineapig/NCSC-MAR-Goofy-Guineapig.pdf
    author: Nasreddine Bencherchali (Nextron Systems)
    date: 2023-05-15
    tags:
        - attack.persistence
        - detection.emerging-threats
    logsource:
        product: windows
        service: system
    detection:
        selection:
            Provider_Name: 'Service Control Manager'
            EventID: 7045
            ServiceName: 'GoogleUpdate'
            ImagePath|contains|all:
                - 'rundll32'
                - 'FileProtocolHandler'
                - '\ProgramData\GoogleUpdate\GoogleUpdate.exe'
        condition: selection
    falsepositives:
        - Unlikely
    level: critical
