    logsource:
        category: image_load
        product: windows
    detection:
        selection:
            Image|endswith: '\excel.exe'
            ImageLoaded|endswith: '.xll'
        condition: selection
    falsepositives:
        - The rules is only looking for ".xll" loads. So some false positives are expected with legitimate and allowed XLLs
