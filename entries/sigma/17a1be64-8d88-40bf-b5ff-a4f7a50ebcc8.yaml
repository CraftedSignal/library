id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
name: Suspicious New Service Creation
description: Detects creation of a new service via "sc" command or the powershell "new-service" cmdlet with suspicious binary paths
query: |
    title: Suspicious New Service Creation
    id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    related:
        - id: 7fe71fc9-de3b-432a-8d57-8c809efc10ab
          type: derived
    status: test
    description: Detects creation of a new service via "sc" command or the powershell "new-service" cmdlet with suspicious binary paths
    references:
        - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md
        - https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
    author: Nasreddine Bencherchali (Nextron Systems)
    date: 2022-07-14
    modified: 2022-11-18
    tags:
        - attack.persistence
        - attack.privilege-escalation
        - attack.t1543.003
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_sc:
            Image|endswith: '\sc.exe'
            CommandLine|contains|all:
                - 'create'
                - 'binPath='
        selection_posh:
            CommandLine|contains|all:
                - 'New-Service'
                - '-BinaryPathName'
        susp_binpath:
            CommandLine|contains:
                # Add more suspicious commands or binaries
                - 'powershell'
                - 'mshta'
                - 'wscript'
                - 'cscript'
                - 'svchost'
                - 'dllhost'
                - 'cmd '
                - 'cmd.exe /c'
                - 'cmd.exe /k'
                - 'cmd.exe /r'
                - 'rundll32'
                # Add more suspicious paths
                - 'C:\Users\Public'
                - '\Downloads\'
                - '\Desktop\'
                - '\Microsoft\Windows\Start Menu\Programs\Startup\'
                - 'C:\Windows\TEMP\'
                - '\AppData\Local\Temp'
        condition: 1 of selection* and susp_binpath
    falsepositives:
        - Unlikely
    level: high
    regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_susp_service_creation/info.yml
