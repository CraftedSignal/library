id: b3c9d417-5a2e-4f80-8c1b-9e7d2a4f6c08
name: PROMPTFLUX Runtime Artifacts (Thinking Robot Log / Startup Self-Copy)
description: |
    Detects host artifacts specific to the PROMPTFLUX VBScript dropper: creation of the "Thinking Robot"
    response log in %TEMP% and/or a script (.vbs/.js/.wsf) written to the user Startup folder for persistence.
    PROMPTFLUX logs Gemini API responses to %TEMP%\thinking_robot_log.txt and writes regenerated,
    self-obfuscated copies of itself to the Startup folder (and copies to removable drives / mapped shares).
query: |
    title: PROMPTFLUX Runtime Artifacts (Thinking Robot Log / Startup Self-Copy)
    name: promptflux_artifacts_fileevent
    id: b3c9d417-5a2e-4f80-8c1b-9e7d2a4f6c08
    status: experimental
    description: |
        Detects host artifacts specific to the PROMPTFLUX VBScript dropper: creation of the "Thinking Robot"
        response log in %TEMP% and/or a script (.vbs/.js/.wsf) written to the user Startup folder for persistence.
        PROMPTFLUX logs Gemini API responses to %TEMP%\thinking_robot_log.txt and writes regenerated,
        self-obfuscated copies of itself to the Startup folder (and copies to removable drives / mapped shares).
    references:
        - https://thehackernews.com/2025/11/google-uncovers-promptflux-malware-that.html
        - https://www.cybersecurity-help.cz/blog/5059.html
        - https://cloud.google.com/blog/topics/threat-intelligence/threat-actor-usage-of-ai-tools
    author: Raymond DePalma (@depalmar)
    date: 2026-08-12
    tags:
        - attack.persistence
        - attack.t1547.001
        - attack.defense-evasion
        - attack.t1027
        - atlas.aml-t0096
    logsource:
        category: file_event
        product: windows
    detection:
        selection_log:
            TargetFilename|contains: 'thinking_robot_log'
        selection_log_temp:
            TargetFilename|contains: '\Temp\'
        selection_startup_script:
            TargetFilename|contains: '\Start Menu\Programs\Startup\'
            TargetFilename|endswith:
                - '.vbs'
                - '.vbe'
                - '.js'
                - '.jse'
                - '.wsf'
                - '.hta'
        condition: (selection_log and selection_log_temp) or selection_log or selection_startup_script
    falsepositives:
        - Legitimate logon scripts placed in Startup by administrators (validate provenance and content).
        - The thinking_robot_log filename is PROMPTFLUX-specific and should be treated as high fidelity.
    level: high
query_type: sigma
severity: high
