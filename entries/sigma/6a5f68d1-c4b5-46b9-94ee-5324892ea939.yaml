        product: windows
    detection:
        selection_pe:
            - Image|endswith:
                  - \Sysmon64.exe
                  - \Sysmon64a.exe
                  - \Sysmon.exe
            - Description: 'System activity monitor'
        selection_cli:
            CommandLine|contains|windash: '-u'
        condition: all of selection_*
    falsepositives:
        - Legitimate administrators might use this command to remove Sysmon for debugging purposes
    level: high
