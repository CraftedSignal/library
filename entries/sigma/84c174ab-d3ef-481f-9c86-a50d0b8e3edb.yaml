    tags:
        - attack.credential-access
        - attack.t1003.001
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains: 'Get-Process lsass'
        condition: selection
    falsepositives:
