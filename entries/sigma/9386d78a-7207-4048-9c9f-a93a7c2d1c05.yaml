    modified: 2023-02-09
    tags:
        - attack.stealth
        - attack.t1218.011
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith: '\rundll32.exe'
            - OriginalFileName: 'RUNDLL32.EXE'
        selection_cli:
            CommandLine|contains|all:
                - 'pcwutl'
                - 'LaunchApplication'
        condition: all of selection_*
    falsepositives:
        - Use of Program Compatibility Troubleshooter Helper
    level: medium
