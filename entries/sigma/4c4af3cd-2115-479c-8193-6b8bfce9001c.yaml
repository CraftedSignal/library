    date: 2020-10-10
    modified: 2022-12-25
    tags:
        - attack.exfiltration
        - attack.t1048.003
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains|all:
                - 'New-Object'
                - 'System.Net.NetworkInformation.Ping'
                - '.Send('
        condition: selection
    falsepositives:
        - Legitimate usage of System.Net.NetworkInformation.Ping class
    level: medium
