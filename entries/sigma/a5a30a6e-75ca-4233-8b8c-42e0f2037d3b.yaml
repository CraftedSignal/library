        - attack.t1059.001
    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection_4104:
            ScriptBlockText|contains|all:
                - '&&'
                - 'rundll32'
                - 'shell32.dll'
                - 'shellexec_rundll'
            ScriptBlockText|contains:
                - 'value'
                - 'invoke'
                - 'comspec'
                - 'iex'
        condition: selection_4104
    falsepositives:
        - Unknown
    level: high
