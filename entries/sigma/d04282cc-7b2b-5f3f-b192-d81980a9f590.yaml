id: d04282cc-7b2b-5f3f-b192-d81980a9f590
name: Langflow Code Validation Endpoint Exploitation Attempt
description: |
    Detects requests to the Langflow endpoints associated with CVE-2025-3248
    (unauthenticated RCE, CVSS 9.8, CISA KEV) and CVE-2026-5027 (path traversal to
    arbitrary file write). CVE-2025-3248 was mass-exploited to deploy the Flodrix
    botnet, with operators enumerating exposed instances via Shodan and FOFA first.
    Because exploitation frequently predated patching, run this retrospectively.
query: |
    title: Langflow Code Validation Endpoint Exploitation Attempt
