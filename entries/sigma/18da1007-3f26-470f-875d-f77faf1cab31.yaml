name: Ps.exe Renamed SysInternals Tool
description: Detects renamed SysInternals tool execution with a binary named ps.exe as used by Dragonfly APT group and documented in TA17-293A report
query: |
    title: Ps.exe Renamed SysInternals Tool
    id: 18da1007-3f26-470f-875d-f77faf1cab31
    status: test
    description: Detects renamed SysInternals tool execution with a binary named ps.exe as used by Dragonfly APT group and documented in TA17-293A report
    references:
        - https://www.us-cert.gov/ncas/alerts/TA17-293A
    author: Florian Roth (Nextron Systems)
    date: 2017-10-22
    modified: 2023-05-02
    tags:
        - attack.stealth
        - attack.g0035
        - attack.t1036.003
        - car.2013-05-009
        - detection.emerging-threats
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            CommandLine|contains|all:
                - 'ps.exe -accepteula'
                - '-s cmd /c netstat'
        condition: selection
    falsepositives:
        - Renamed SysInternals tool
    level: high
