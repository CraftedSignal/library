id: cf5ee356-65c4-4556-8d11-6977fcdfed4b
name: Low Reputation Effective Top-Level Domain (eTLD)
description: Detects DNS queries to domains within known low reputation eTLDs. This rule uses AlphaSOC's threat intelligence data and is updated on a monthly basis.
query: |
    title: Low Reputation Effective Top-Level Domain (eTLD)
    id: cf5ee356-65c4-4556-8d11-6977fcdfed4b
    status: experimental
    description: Detects DNS queries to domains within known low reputation eTLDs. This rule uses AlphaSOC's threat intelligence data and is updated on a monthly basis.
    references:
        - https://feeds.alphasoc.net/bad-etlds.txt
    author: Norbert Jaśniewicz (AlphaSOC)
    date: 2025-08-04
    tags:
        - attack.command-and-control
        - attack.t1071.004
        - attack.initial-access
        - detection.threat-hunting
    logsource:
        category: dns
    detection:
        selection:
            query|endswith:
                - '.duckdns.org'
                - '.top'
                - '.ddns.net'
                - '.gl.at.ply.gg'
                - '.portmap.io'
                - '.icu'
                - '.zapto.org'
                - '.live'
                - '.hopto.org'
                - '.portmap.host'
                - '.sbs'
                - '.sytes.net'
                - '.click'
                - '.ydns.eu'
                - '.site'
                - '.cloud'
                - '.no-ip.org'
                - '.kozow.com'
                - '.lat'
                - '.pro'
        condition: selection
    falsepositives:
        - Unknown
    level: medium
query_type: sigma
severity: medium
techniques:
    - T1071.004
