    tags:
        - attack.discovery
        - attack.t1087
    logsource:
        product: windows
        category: process_creation
    detection:
        selection_1:
            CommandLine|contains:
                - ' --buildcache '
                - ' --bhdump '
                - ' --certdump '
                - ' --dnsdump '
        selection_2:
            CommandLine|contains:
                - ' -c '
                - ' --cachefilename '
                - ' -o '
                - ' --outputdirectory'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: high
