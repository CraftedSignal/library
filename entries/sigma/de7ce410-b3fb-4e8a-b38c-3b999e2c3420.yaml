    date: 2022-10-26
    tags:
        - attack.execution
        - attack.t1569.002
    logsource:
        product: windows
        service: system
    detection:
        selection_eid:
            Provider_Name: 'Service Control Manager'
            EventID: 7045
        selection_image:
            - ServiceName|startswith: 'PAExec-'
            - ImagePath|startswith: 'C:\WINDOWS\PAExec-'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: medium
