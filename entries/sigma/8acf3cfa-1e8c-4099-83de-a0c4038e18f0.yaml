    tags:
        - attack.stealth
        - attack.t1218.011
        - detection.emerging-threats
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            CommandLine|contains|all:
                - 'regsvr32'
                - '/s'
                - '/i'
                - '\AppData\Roaming\'
                - '.ocx'
        condition: selection
    falsepositives:
        - Unknown
    level: critical
