    tags:
        - attack.command-and-control
        - attack.t1105
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith: '\certoc.exe'
            - OriginalFileName: 'CertOC.exe'
        selection_cli:
            CommandLine|contains|all:
                - '-GetCACAPS'
                - 'http'
        condition: all of selection*
    falsepositives:
        - Unknown
    level: medium
