    logsource:
        product: windows
        category: ps_script
        definition: 'Requirements: Script Block Logging must be enabled'
    detection:
        selection:
            ScriptBlockText|contains:
                - 'Compress-Archive -Path*-DestinationPath $env:TEMP'
                - 'Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\'
                - 'Compress-Archive -Path*-DestinationPath*:\Windows\Temp\'
        condition: selection
    falsepositives:
        - Unknown
    level: medium
    regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_zip_compress/info.yml
