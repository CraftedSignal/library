        category: file_event
    detection:
        selection:
            Image|endswith: '\colorcpl.exe'
        filter_ext:
            TargetFilename|endswith:
                - '.icm'
                - '.gmmp'
                - '.cdmp'
                - '.camp'
        condition: selection and not 1 of filter_*
    falsepositives:
        - Unknown
    level: high
