name: DarkGate - User Created Via Net.EXE
description: Detects creation of local users via the net.exe command with the name of "DarkGate"
query: |
    title: DarkGate - User Created Via Net.EXE
    id: bf906d7b-7070-4642-8383-e404cf26eba5
    status: test
    description: Detects creation of local users via the net.exe command with the name of "DarkGate"
    references:
        - Internal Research
    author: X__Junior (Nextron Systems)
    date: 2023-08-27
    modified: 2023-10-15
    tags:
        - attack.persistence
        - attack.t1136.001
        - detection.emerging-threats
    logsource:
        category: process_creation
        product: windows
    detection:
        # /c net user /add SafeMode DarkGate0!
        selection:
            Image|endswith:
                - '\net.exe'
                - '\net1.exe'
            CommandLine|contains|all:
                - 'user'
                - 'add'
                - 'DarkGate'
                - 'SafeMode'
        condition: selection
    falsepositives:
        - Unlikely
    level: high
