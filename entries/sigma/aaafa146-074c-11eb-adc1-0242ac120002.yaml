    date: 2020-10-05
    modified: 2023-02-04
    tags:
        - attack.credential-access
        - attack.t1110
        - attack.t1110.001
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            CommandLine|contains|all:
                - '-u '
                - '-p '
            CommandLine|contains:
                - '^USER^'
                - '^PASS^'
        condition: selection
    falsepositives:
        - Software that uses the caret encased keywords PASS and USER in its command line
    level: high
