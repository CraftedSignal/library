    tags:
        - attack.stealth
        - attack.t1027
        - attack.execution
        - attack.t1059.001
    logsource:
        category: process_creation
        product: windows
    detection:
        selection:
            CommandLine|contains|all:
                - 'new-object'
                - 'text.encoding]::ascii'
            CommandLine|contains:
                - 'system.io.compression.deflatestream'
                - 'system.io.streamreader'
                - 'readtoend('
        condition: selection
    falsepositives:
        - Unknown
    level: medium
