    tags:
        - attack.execution
        - detection.emerging-threats
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_1:
            CommandLine|contains|all:
                - ' /c '
                - 'powershell'
                - '-nop -w hidden'
                - 'Invoke-WebRequest'
                - 'setup.msi'
                - '-OutFile'
        selection_2:
            CommandLine|contains|all:
                - 'msiexec '
                - '/i '
                - 'setup.msi '
                - '/qn '
                - 'IntegratorLogin=fimaribahundq'
        condition: 1 of selection_*
    falsepositives:
        - Unlikely
    level: high
