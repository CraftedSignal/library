id: 377ca8f3-168a-5028-aee4-f7191ff60ba7
name: Large Model File Written to Endpoint
description: |
    Detects model weight files being written to an endpoint. On its own this is an
    inventory signal for shadow AI rather than an intrusion alert, but it is worth
    tracking: model files are multi-gigabyte, arrive from unvetted repositories, and
    a runtime capable of loading them is usually accompanied by an unauthenticated
    local API.
