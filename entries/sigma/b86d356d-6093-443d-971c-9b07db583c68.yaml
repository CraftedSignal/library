    author: Nasreddine Bencherchali (Nextron Systems)
    date: 2022-09-15
    tags:
        - attack.command-and-control
        - attack.t1071.001
    logsource:
        category: process_creation
        product: linux
    detection:
        selection:
            Image|endswith: '/curl'
            CommandLine|contains:
                - ' -A '
                - ' --user-agent '
        condition: selection
    falsepositives:
        - Scripts created by developers and admins
        - Administrative activity
    level: medium
