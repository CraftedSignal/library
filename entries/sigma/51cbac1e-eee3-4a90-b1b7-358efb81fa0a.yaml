    logsource:
        product: windows
        category: process_creation
    detection:
        selection_img:
            - OriginalFileName: 'wmic.exe'
            - Image|endswith: '\WMIC.exe'
        selection_cli:
            CommandLine|contains: '/Namespace:\\\\root\\Microsoft\\Windows\\Defender'
        condition: all of selection_*
