    detection:
        selection_whoami:
            CommandLine|contains: 'whoami'
        selection_cmd_1:
            CommandLine|contains:
                - './Client/Common/'
                - '.\Client\Common\'
        selection_cmd_2:
            CommandLine|contains: 'C:\Windows\Temp\Serv-U.bat'
        condition: selection_whoami and 1 of selection_cmd*
    falsepositives:
        - Unlikely
