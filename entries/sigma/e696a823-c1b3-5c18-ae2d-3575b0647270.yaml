                - '\regsvr32.exe'
                - '\rundll32.exe'
                - '\certutil.exe'
                - '\bitsadmin.exe'
                - '\wscript.exe'
                - '\cscript.exe'
                - '\installutil.exe'
                - '\msbuild.exe'
        condition: all of selection_*
    falsepositives:
        - Build tooling invoking msbuild through an agent-managed terminal
    level: high
