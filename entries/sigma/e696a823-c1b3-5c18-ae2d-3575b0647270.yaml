id: e696a823-c1b3-5c18-ae2d-3575b0647270
name: AI Agent Process Spawning LOLBAS Binary
description: |
    Detects an AI agent or MCP server launching a living-off-the-land binary commonly
    used for download, execution, or defence evasion. Unlike a plain shell, these
    binaries are rarely part of a legitimate coding workflow, which makes this a
    materially higher-fidelity signal. An audit of MCP marketplace agents found agents
    wired to invoke exactly these chains through signed Microsoft binaries.
query: |
    title: AI Agent Process Spawning LOLBAS Binary
    id: e696a823-c1b3-5c18-ae2d-3575b0647270
