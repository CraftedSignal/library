    author: frack113
    date: 2022-12-29
    modified: 2024-06-04
    tags:
        - attack.stealth
        - attack.t1218
    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith: '\unregmp2.exe'
            - OriginalFileName: 'unregmp2.exe'
        selection_cmd:
            CommandLine|contains|windash: ' /HideWMP'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: medium
