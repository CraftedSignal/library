    logsource:
        category: process_creation
        product: windows
    detection:
        selection_img:
            - Image|endswith: '\deviceenroller.exe'
            - OriginalFileName: 'deviceenroller.exe'
        selection_cli:
            CommandLine|contains: '/PhoneDeepLink'
        condition: all of selection_*
    falsepositives:
        - Unknown
    level: medium
