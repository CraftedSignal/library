id: 019afff3-0c3c-7467-aa86-8ebfa7b168b5
name: AWS IAM Role Trust Policy Modification to External Account
description: "Detects the creation or modification of an IAM Role trust policy that grants assume-role permissions to an AWS account that is not part of the organization. This action creates a backdoor for an external entity to gain persistent access to your environment, often used by attackers to maintain unauthorized access. This rule relies on an `aws_org_accounts.csv` lookup table to identify accounts belonging to the organization. If this lookup is not established, manual filtering of AWS accounts will be required. \n\nService Accounts may need to be filtered. "
query: |-
    index=cloudtrail sourcetype=aws:cloudtrail eventSource="iam.amazonaws.com" eventName IN ("CreateRole", "UpdateAssumeRolePolicy")
    | eval assume_doc = coalesce('requestParameters.assumeRolePolicyDocument', 'requestParameters.policyDocument')
    | eval assume_doc = urldecode(assume_doc)
    | rex field=assume_doc max_match=0 "\"arn:aws:iam::(?<principal_account_ids>\d{12})"
    | mvexpand principal_account_ids
    | where isnotnull(principal_account_ids)
    | where principal_account_ids != aws_account_id
    | lookup aws_org_accounts.csv account_id as principal_account_ids OUTPUT account_id as org_account_id
    | where isnull(org_account_id)
    | stats min(_time) as initial_detection_time values(sourceIPAddress) as src_ip values(eventName) as eventName values(assume_doc) as assumed_policies values(aws_account_id) as cloudaccount values(principal_account_ids) as external_account values(awsRegion) as awsregion by user_arn, requestParameters.roleName
    | where isnotnull(external_account) AND external_account!=""
    | rename requestParameters.roleName as role_assumed
    | eval initial_detection_time = strftime(initial_detection_time, "%F %T %Z")
query_type: spl
severity: medium
tactics:
    - TA0003
    - TA0005
    - TA0001
techniques:
    - T1199
    - T1133
tags:
    - spl
author: tayvion p. (@tayontech)
version: "3"
