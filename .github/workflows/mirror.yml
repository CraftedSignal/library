name: Sync upstream
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .github/mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SigmaHQ/sigma
          path: .upstream/sigma
          fetch-depth: 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: huntresslabs/threat-intel
          path: .upstream/huntress-threat-intel
          fetch-depth: 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: depalmar/ai-dfir-toolkit
          path: .upstream/ai-dfir-toolkit
          fetch-depth: 1

      - name: Resolve Go version
        id: go-version
        run: echo "version=$(grep -oP '(?<=golang:)\S+' ../go/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: false
          cache-dependency-path: .github/mirror/go.sum

      - name: Refresh detections.ai community mirror
        continue-on-error: true
        run: go run . --output-dir "$GITHUB_WORKSPACE"
        env:
          UPSTREAM_REFRESH_TOKEN: ${{ secrets.UPSTREAM_REFRESH_TOKEN }}
      - name: Merge quality-gated curated Sigma rules
        working-directory: .github/sigmahq
        run: >-
          go run .
          --output-dir "$GITHUB_WORKSPACE"
          --sigma-dir "$GITHUB_WORKSPACE/.upstream/sigma"
          --huntress-dir "$GITHUB_WORKSPACE/.upstream/huntress-threat-intel"
          --ai-dfir-toolkit-dir "$GITHUB_WORKSPACE/.upstream/ai-dfir-toolkit"

      - name: Rotate refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          TOKEN_FILE: ${{ github.workspace }}/.new-refresh-token
        run: |
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set UPSTREAM_REFRESH_TOKEN --repo "$REPO" < "$TOKEN_FILE"
            echo "Refresh token rotated"
          fi

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: 'sync: update community detections'
          file_pattern: 'entries library.index.yaml sigmahq.sync.yaml huntress.sync.yaml ai-dfir-toolkit.sync.yaml'
