name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Mirror tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Existing repository quality tests read the Sigma entries and root index.
          # Other generated query-language directories are not needed by this suite.
          sparse-checkout: |
            .github
            entries/sigma

      - name: Resolve Go version
        id: go-version
        run: echo "version=$(sed -n 's/^FROM golang://p' .github/go/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: false

      - name: Test mirror PR publication
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'

      - name: Test and vet mirror helpers
        shell: bash
        run: |
          set -euo pipefail
          for module in .github/mirror .github/sigmahq; do
            (cd "$module" && go test -race -timeout=5m ./... && go vet ./...)
          done

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Scan mirror helpers
        shell: bash
        run: |
          set -euo pipefail
          for module in .github/mirror .github/sigmahq; do
            (cd "$module" && govulncheck ./...)
          done
